    <g fill="#9DBF4E">
      <ellipse cx="304" cy="162" rx="7" ry="15" transform="rotate(-30 304 162)"/>
      <ellipse cx="326" cy="166" rx="7" ry="15" transform="rotate(30 326 166)"/>
      <ellipse cx="303" cy="190" rx="7" ry="15" transform="rotate(-30 303 190)"/>
      <ellipse cx="327" cy="194" rx="7" ry="15" transform="rotate(30 327 194)"/>
      <ellipse cx="301" cy="218" rx="7" ry="15" transform="rotate(-30 301 218)"/>
      <ellipse cx="325" cy="222" rx="7" ry="15" transform="rotate(30 325 222)"/>
