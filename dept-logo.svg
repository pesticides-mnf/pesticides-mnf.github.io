<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Pesticides Department badge — vector redraw.
       Text uses "Alexandria" (Google Fonts). For print: install Alexandria, then convert text to outlines. -->
  <defs>
        <path id="dl-bot" d="M 40 200 A 160 160 0 0 0 360 200"/>
    <clipPath id="dl-flask"><path d="M184 150 V108 h32 V150 L268 254 Q274 270 258 270 H142 Q126 270 132 254 Z"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="198" fill="#fff"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#1E5B35" stroke-width="11"/>
  <path d="M 78 248 A 130 130 0 1 1 322 248" fill="none" stroke="#9DBF4E" stroke-width="4" stroke-linecap="round"/>

  <g font-family="Alexandria, 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="30" fill="#1E5B35" text-anchor="middle">
    <text x="297.8" y="90.3" textLength="46" lengthAdjust="spacingAndGlyphs" transform="rotate(41.7 297.8 90.3)">قسم</text>
    <text x="216.0" y="53.9" textLength="88" lengthAdjust="spacingAndGlyphs" transform="rotate(6.2 216.0 53.9)">مبيدات</text>
    <text x="114.7" y="80.3" textLength="78" lengthAdjust="spacingAndGlyphs" transform="rotate(-35.5 114.7 80.3)">الآفات</text>
  </g>
  <circle cx="50" cy="246" r="5" fill="#1E5B35"/>
  <circle cx="350" cy="246" r="5" fill="#1E5B35"/>
  <text font-family="Alexandria, 'IBM Plex Sans', sans-serif" font-weight="700" font-size="22" letter-spacing="1.5" fill="#33413A">
    <textPath href="#dl-bot" startOffset="50%" text-anchor="middle">PESTICIDES DEPARTMENT</textPath>
  </text>

  <!-- sprayer -->
  <g>
    <path d="M102 196 Q100 150 128 136" fill="none" stroke="#1E5B35" stroke-width="5" stroke-linecap="round"/>
    <path d="M126 138 l14 -8" stroke="#1E5B35" stroke-width="6" stroke-linecap="round"/>
    <g fill="#9DBF4E"><circle cx="150" cy="122" r="2.6"/><circle cx="158" cy="130" r="2.2"/><circle cx="156" cy="116" r="2"/><circle cx="164" cy="122" r="1.8"/><circle cx="148" cy="112" r="1.6"/><circle cx="166" cy="134" r="1.5"/></g>
    <rect x="70" y="196" width="40" height="80" rx="13" fill="#1E5B35"/>
    <rect x="78" y="208" width="8" height="54" rx="4" fill="#5E9E3A"/>
    <rect x="82" y="182" width="16" height="16" rx="3" fill="#1E5B35"/>
    <path d="M90 182 V170 h18" fill="none" stroke="#1E5B35" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- wheat -->
  <g transform="translate(-10 12)">
