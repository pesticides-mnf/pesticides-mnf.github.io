  <path d="M200 262 C198 238 202 214 214 196" fill="none" stroke="#3F7F2E" stroke-width="4" stroke-linecap="round"/>
  <path d="M202 232 C178 232 162 214 164 192 C186 192 202 208 202 232Z" fill="#5E9E3A"/>
  <path d="M210 210 C222 186 246 172 274 176 C268 202 240 216 210 210Z" fill="#7FB241"/>
  <path d="M210 210 C232 198 250 188 268 182" fill="none" stroke="#fff" stroke-width="1.6" opacity=".6"/>
  <path d="M202 232 C190 222 178 208 170 196" fill="none" stroke="#fff" stroke-width="1.6" opacity=".6"/>

  <!-- magnifier + bug -->
  <path d="M272 284 L289 301" stroke="#1E5B35" stroke-width="13" stroke-linecap="round"/>
  <circle cx="252" cy="262" r="29" fill="#fff" stroke="#1E5B35" stroke-width="8"/>
  <g stroke="#2F3B3F" stroke-width="2.4" stroke-linecap="round">
    <path d="M244 256 l-10 -6 M244 264 h-12 M244 272 l-10 6 M260 256 l10 -6 M260 264 h12 M260 272 l10 6 M248 246 l-5 -8 M256 246 l5 -8"/>
