  <!-- flask -->
  <path d="M184 150 V108 h32 V150 L268 254 Q274 270 258 270 H142 Q126 270 132 254 Z" fill="#fff"/>
  <g clip-path="url(#dl-flask)">
    <rect x="120" y="214" width="160" height="70" fill="#A7C957"/>
    <path d="M120 214 Q160 206 200 214 T280 214 V222 H120Z" fill="#8DB43E"/>
